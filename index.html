<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe-Coded Tools — Free Browser-Based Utilities</title>
    <meta name="description" content="A growing collection of free, privacy-first browser tools. Nothing leaves your device. No servers, no tracking, no ads." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>" />
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 30%, #1e3a8a 60%, #0f172a 100%); background-size: 200% 200%; animation: heroShift 12s ease-in-out infinite alternate; }
        @keyframes heroShift { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 50%; } }
        .tool-card { position: relative; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); border-radius: 16px; padding: 1.75rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tool-card:hover { transform: translateY(-6px); border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.4); }
        .badge-new { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.175rem 0.5rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; background: linear-gradient(135deg, #059669, #10b981); color: white; }
        .category-tag { display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 500; }
        .search-bar { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(51, 65, 85, 0.5); border-radius: 14px; padding: 0.75rem 1.25rem; width: 100%; color: #f1f5f9; }
        .chip { display: inline-flex; align-items: center; padding: 0.35rem 0.85rem; border-radius: 9999px; font-size: 0.8rem; cursor: pointer; border: 1px solid transparent; }
        .chip-active { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }
        .chip-inactive { background: rgba(30, 41, 59, 0.4); color: rgba(148, 163, 184, 0.8); border-color: rgba(51, 65, 85, 0.4); }
        .stat-value { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <nav class="fixed top-0 left-0 right-0 z-50 border-b border-gray-800/50" style="background: rgba(2,6,23,0.8); backdrop-filter: blur(16px);">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="./" class="font-bold">Vibe-Coded Tools</a>
        </div>
    </nav>
    <section class="hero-gradient pt-24 pb-20 text-center">
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold mb-5">Free Tools, <span class="text-blue-400">Zero Compromises</span></h1>
        <div class="stat-value" id="statTools">22</div>
    </section>
    <section class="max-w-6xl mx-auto px-4 pb-20">
        <input type="text" id="searchInput" class="search-bar mb-8" placeholder="Search..." />
        <div id="tools-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>
    <script>
        const CATEGORY_MAP = {
            'base64': 'Encoding', 'uuid-generator': 'Generation', 'hash-generator': 'Security', 'json-formatter': 'Developer Tools',
            'jwt-decoder': 'Security', 'timestamp-converter': 'Conversion', 'url-encoder': 'Encoding', 'lorem-ipsum': 'Generation',
            'case-converter': 'Conversion', 'password-generator': 'Security', 'image-editor': 'Image', 'qr-code': 'Generation',
            'color-converter': 'Conversion', 'regex-tester': 'Developer Tools', 'text-diff': 'Developer Tools', 'number-base': 'Conversion',
            'vscode-theme-generator': 'Developer Tools', 'cron-parser': 'Developer Tools', 'json-yaml-converter': 'Conversion',
            'markdown-preview': 'Developer Tools', 'csv-viewer': 'Developer Tools', 'curl-converter': 'Developer Tools'
        };
        const NEW_TOOL_IDS = new Set(['vscode-theme-generator', 'cron-parser', 'json-yaml-converter', 'markdown-preview', 'csv-viewer', 'curl-converter']);
        const container = document.getElementById('tools-container');
        fetch('tools.json').then(r => r.json()).then(data => {
            data.tools.forEach(t => {
                const isNew = NEW_TOOL_IDS.has(t.id);
                container.innerHTML += `
                    <a href="${t.path}" class="tool-card group">
                        <div class="flex justify-between items-start mb-3">
                            <div class="text-3xl">${t.icon}</div>
                            ${isNew ? '<span class="badge-new">New</span>' : ''}
                        </div>
                        <h3 class="font-semibold text-lg group-hover:text-blue-300">${t.name}</h3>
                        <p class="text-sm text-gray-400">${t.description}</p>
                    </a>
                `;
            });
        });
    </script>
</body>
</html>
